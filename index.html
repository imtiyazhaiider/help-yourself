<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#1f2937"
    >

    <meta
        name="description"
        content="Find local service providers in your area."
    >

    <title>Help Yourself</title>


    <link
        rel="stylesheet"
        href="style.css"
    >


    <link
        rel="manifest"
        href="manifest.json"
    >

</head>


<body>

    <header>

        <h1>Help Yourself</h1>

        <p>Find the person you need.</p>

    </header>


    <main>

        <!-- Home -->

        <section id="home-section">

            <h2>Categories</h2>

            <div id="categories"></div>

        </section>


        <!-- People -->

        <section id="people-section">

            <button id="back-button">
                ← Back to categories
            </button>


            <h2 id="category-title"></h2>


            <!-- Location Filter -->

            <div class="filter-box">

                <label for="location-filter">
                    Filter by village
                </label>


                <select id="location-filter">

                    <option value="all">
                        All villages
                    </option>

                </select>

            </div>


            <div id="people"></div>

        </section>

    </main>


    <!-- Supabase -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- Application -->

    <script src="data.js"></script>

    <script src="script.js"></script>


    <!-- Service Worker -->

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                function() {

                    navigator.serviceWorker.register(
                        "service-worker.js"
                    );

                }
            );

        }

    </script>

</body>

</html>
